<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los Fulañeros</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f5;
  color: #222;
}

header {
  background: linear-gradient(135deg, #111, #333);
  color: white;
  text-align: center;
  padding: 70px 20px;
}

header h1 {
  margin: 0;
  font-size: 48px;
}

header p {
  font-size: 19px;
  opacity: 0.85;
}

.menu {
  max-width: 950px;
  margin: 35px auto;
  padding: 20px;

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}

.boton {
  display: block;
  background: white;
  color: #222;
  text-decoration: none;
  text-align: center;
  padding: 40px 15px;
  border-radius: 24px;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
  transition: 0.25s;
}

.boton:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.16);
}

footer {
  text-align: center;
  padding: 50px 20px;
  background: #111;
  color: #aaa;
}

footer strong {
  color: white;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 36px;
  }

  .menu {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>LOS FULAÑEROS</h1>
  <p>Bienvenidos a nuestra web</p>
</header>

<div class="menu">

  <a class="boton" href="comidas.html">
    🍽️<br>
    Comilonas
  </a>

  <a class="boton" href="rutas.html">
    🗺️<br>
    Rutas
  </a>

  <a class="boton" href="pinpon.html">
    🏓<br>
    PinPon
  </a>

  <a class="boton" href="fiestas.html">
    🎉<br>
    Fiestas
  </a>

  <a class="boton" href="pielago.html">
    🌊<br>
    Piélago
  </a>

  <a class="boton" href="quienes-somos.html">
    👥<br>
    ¿Quiénes somos?
  </a>

</div>

<footer>
  <strong>LOS FULAÑEROS</strong>
  <br><br>
  Nuestra web
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Fulañeros</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
    }

    .menu {
      max-width: 900px;
      margin: 35px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .categoria {
      background: white;
      border-radius: 20px;
      padding: 35px 15px;
      text-align: center;
      text-decoration: none;
      color: #222;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .categoria:hover {
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      .menu {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>LOS FULAÑEROS</h1>
    <p>Bienvenidos a nuestra web</p>
  </header>

  <div class="menu">

    <a class="categoria" href="#">🍽️<br>Comilonas</a>

    <a class="categoria" href="#">🗺️<br>Rutas</a>

    <a class="categoria" href="#">🏓<br>PinPon</a>

    <a class="categoria" href="#">🎉<br>Fiestas</a>

    <a class="categoria" href="#">🌊<br>Piélago</a>

    <a class="categoria" href="#">👥<br>¿Quiénes somos?</a>

  </div>

  <footer>
    Los Fulañeros
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comilonas - Los Fulañeros</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff3e0;
  color: #222;

  background-image: none !important;
}

/* CABECERA */

header {
  background: linear-gradient(135deg, #ff8a00, #ffb347);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  margin: 0;
  font-size: 44px;
}

header p {
  font-size: 18px;
  margin-top: 10px;
}

/* CONTENIDO */

main {
  max-width: 1000px;
  margin: 35px auto;
  padding: 20px;
}

/* VOLVER */

.volver {
  display: inline-block;
  margin-bottom: 25px;
  background: #111;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
}

/* INTRODUCCIÓN */

.introduccion {
  background: white;
  padding: 30px;
  border-radius: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
  margin-bottom: 30px;
}

.introduccion h2 {
  margin-top: 0;
  font-size: 30px;
}

.introduccion p {
  font-size: 18px;
  line-height: 1.6;
}

/* GALERÍA */

.galeria {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.foto {
  background: white;
  padding: 10px;
  border-radius: 18px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.10);
}

.foto img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 12px;
  display: block;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.foto img:active {
  transform: scale(0.97);
}

.sin-fotos {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  font-size: 18px;
}

/* VISOR */

#visor {
  display: none;

  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  z-index: 99999;

  background: rgba(0,0,0,0.95);

  align-items: center;
  justify-content: center;

  padding: 20px;
}

#fotoGrande {
  max-width: 95%;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  border-radius: 12px;

  display: block;
}

.cerrar {
  position: absolute;

  top: 15px;
  right: 15px;

  width: 48px;
  height: 48px;

  background: white;
  color: #111;

  border: none;

  border-radius: 50%;

  font-size: 25px;
  font-weight: bold;

  cursor: pointer;

  z-index: 100000;
}

.descargar {
  position: absolute;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  background: #ff8a00;
  color: white;

  padding: 14px 22px;

  border-radius: 12px;

  text-decoration: none;

  font-weight: bold;
  font-size: 17px;

  z-index: 100000;
}

/* PIE */

footer {
  text-align: center;
  padding: 45px 20px;
  margin-top: 40px;

  background: #111;
  color: #aaa;
}

footer strong {
  color: white;
}

/* MÓVIL */

@media (max-width: 700px) {

  header h1 {
    font-size: 36px;
  }

  .galeria {
    grid-template-columns: repeat(2, 1fr);
  }

  .foto img {
    height: 180px;
  }

}

@media (max-width: 450px) {

  .galeria {
    grid-template-columns: 1fr;
  }

  .foto img {
    height: auto;
  }

}

</style>

</head>

<body>

<header>

<h1>🍽️ Comilonas</h1>

<p>Los Fulañeros</p>

</header>

<main>

<a class="volver" href="index.html">
← Volver al inicio
</a>

<div class="introduccion">

<h2>🍴 Nuestras comilonas</h2>

<p>
Bienvenidos a la sección de Comilonas de Los Fulañeros.
Aquí iremos guardando nuestras comidas, restaurantes,
planes gastronómicos y recuerdos.
</p>

</div>

<h2>📸 Fotos</h2>

<div class="galeria" id="galeria">

<div class="sin-fotos">
Cargando fotos...
</div>

</div>

</main>

<!-- VISOR -->

<div id="visor">

<button class="cerrar" id="cerrar">
✕
</button>

<img id="fotoGrande" src="" alt="Foto grande">

<a id="botonDescargar"
   class="descargar"
   href=""
   download>
⬇️ Descargar foto
</a>

</div>

<footer>

<strong>LOS FULAÑEROS</strong>

<br><br>

🍽️ Comilonas

</footer>

<script>

const usuario = "veranocongon";
const repositorio = "los-fulaneros";
const carpeta = "fotos";

const galeria = document.getElementById("galeria");
const visor = document.getElementById("visor");
const fotoGrande = document.getElementById("fotoGrande");
const botonDescargar =
document.getElementById("botonDescargar");
const cerrar =
document.getElementById("cerrar");

fetch(
  `https://api.github.com/repos/${usuario}/${repositorio}/contents/${carpeta}`
)

.then(respuesta => respuesta.json())

.then(archivos => {

  galeria.innerHTML = "";

  if (!Array.isArray(archivos)) {

    galeria.innerHTML = `
      <div class="sin-fotos">
        No se han podido cargar las fotos.
      </div>
    `;

    return;
  }

  const fotos = archivos.filter(archivo =>
    archivo.type === "file" &&
    /\.(jpg|jpeg|png|gif|webp|heic|heif)$/i
    .test(archivo.name)
  );

  if (fotos.length === 0) {

    galeria.innerHTML = `
      <div class="sin-fotos">
        Todavía no hay fotos.
      </div>
    `;

    return;
  }

  fotos.forEach(foto => {

    const tarjeta =
    document.createElement("div");

    tarjeta.className = "foto";

    const imagen =
    document.createElement("img");

    imagen.src = foto.download_url;

    imagen.alt =
    "Foto de una comilona";

    imagen.onclick = function() {

      fotoGrande.src =
      foto.download_url;

      botonDescargar.href =
      foto.download_url;

      botonDescargar.setAttribute(
        "download",
        foto.name
      );

      visor.style.display = "flex";

      document.body.style.overflow =
      "hidden";
    };

    tarjeta.appendChild(imagen);

    galeria.appendChild(tarjeta);

  });

})

.catch(error => {

  galeria.innerHTML = `
    <div class="sin-fotos">
      No se han podido cargar las fotos.
    </div>
  `;

});

cerrar.onclick = function() {

  visor.style.display = "none";

  fotoGrande.src = "";

  document.body.style.overflow = "";

};

visor.onclick = function(event) {

  if (event.target === visor) {

    visor.style.display = "none";

    fotoGrande.src = "";

    document.body.style.overflow = "";

  }

};

</script>

</body>
</html>

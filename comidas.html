<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comilonas - Los Fulañeros</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff3e0;
  color: #222;
}

header {
  background: linear-gradient(135deg, #ff8a00, #ffb347);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  margin: 0;
  font-size: 44px;
}

header p {
  font-size: 18px;
  margin-top: 10px;
}

main {
  max-width: 1000px;
  margin: 35px auto;
  padding: 20px;
}

.volver {
  display: inline-block;
  margin-bottom: 25px;
  background: #111;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
}

.introduccion {
  background: white;
  padding: 30px;
  border-radius: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
  margin-bottom: 30px;
}

.introduccion h2 {
  margin-top: 0;
  font-size: 30px;
}

.introduccion p {
  font-size: 18px;
  line-height: 1.6;
}

/* GALERÍA */

.galeria {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.foto {
  background: white;
  padding: 10px;
  border-radius: 18px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.10);
}

.foto img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}

.sin-fotos {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  font-size: 18px;
}

footer {
  text-align: center;
  padding: 45px 20px;
  margin-top: 40px;
  background: #111;
  color: #aaa;
}

footer strong {
  color: white;
}

@media (max-width: 700px) {

  header h1 {
    font-size: 36px;
  }

  .galeria {
    grid-template-columns: repeat(2, 1fr);
  }

  .foto img {
    height: 180px;
  }

}

@media (max-width: 450px) {

  .galeria {
    grid-template-columns: 1fr;
  }

  .foto img {
    height: auto;
  }

}

</style>
</head>

<body>

<header>

<h1>🍽️ Comilonas</h1>

<p>Los Fulañeros</p>

</header>

<main>

<a class="volver" href="index.html">
← Volver al inicio
</a>

<div class="introduccion">

<h2>🍴 Nuestras comilonas</h2>

<p>
Bienvenidos a la sección de Comilonas de Los Fulañeros.
Aquí iremos guardando nuestras comidas, restaurantes,
planes gastronómicos y recuerdos.
</p>

</div>

<h2>📸 Fotos</h2>

<div class="galeria" id="galeria">

<div class="sin-fotos">
Cargando fotos...
</div>

</div>

</main>

<footer>

<strong>LOS FULAÑEROS</strong>

<br><br>

🍽️ Comilonas

</footer>

<script>

const usuario = "veranocongon";
const repositorio = "los-fulaneros";
const carpeta = "fotos";

const galeria = document.getElementById("galeria");

fetch(`https://api.github.com/repos/${usuario}/${repositorio}/contents/${carpeta}`)
.then(respuesta => respuesta.json())
.then(archivos => {

  galeria.innerHTML = "";

  const fotos = archivos.filter(archivo =>
    archivo.type === "file" &&
    /\.(jpg|jpeg|png|gif|webp)$/i.test(archivo.name)
  );

  if (fotos.length === 0) {

    galeria.innerHTML = `
      <div class="sin-fotos">
        Todavía no hay fotos.
      </div>
    `;

    return;
  }

  fotos.forEach(foto => {

    const tarjeta = document.createElement("div");

    tarjeta.className = "foto";

    tarjeta.innerHTML = `
      <img src="${foto.download_url}" alt="Foto de una comilona">
    `;

    galeria.appendChild(tarjeta);

  });

})
.catch(error => {

  galeria.innerHTML = `
    <div class="sin-fotos">
      No se han podido cargar las fotos.
    </div>
  `;

});

</script>

</body>
</html>

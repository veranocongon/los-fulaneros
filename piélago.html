<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piélago - Los Fulañeros</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e8faff;
  color: #222;
}

header {
  background: linear-gradient(135deg, #00a8cc, #55dff5);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  margin: 0;
  font-size: 44px;
}

header p {
  font-size: 18px;
  margin-top: 10px;
}

main {
  max-width: 950px;
  margin: 35px auto;
  padding: 20px;
}

.volver {
  display: inline-block;
  margin-bottom: 25px;
  background: #111;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
}

.contenido {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}

.tarjeta {
  background: white;
  padding: 30px;
  border-radius: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
  transition: 0.25s;
}

.tarjeta:hover {
  transform: translateY(-5px);
}

.tarjeta h2 {
  margin-top: 0;
  font-size: 27px;
}

.tarjeta p {
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 45px 20px;
  margin-top: 40px;
  background: #111;
  color: #aaa;
}

footer strong {
  color: white;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 36px;
  }

  .contenido {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>

<h1>🌊 Piélago</h1>

<p>Los Fulañeros</p>

</header>

<main>

<a class="volver" href="index.html">
← Volver al inicio
</a>

<div class="contenido">

<div class="tarjeta">

<h2>🌊 Piélago</h2>

<p>
Aquí iremos poniendo información sobre Piélago.
</p>

</div>


<div class="tarjeta">

<h2>📍 Lugares</h2>

<p>
Aquí iremos poniendo los lugares relacionados
con Piélago.
</p>

</div>


<div class="tarjeta">

<h2>📅 Planes</h2>

<p>
Aquí iremos poniendo nuestros planes y actividades
en Piélago.
</p>

</div>

</div>

</main>

<footer>

<strong>LOS FULAÑEROS</strong>

<br><br>

🌊 Piélago

</footer>

</body>
</html>
